name: fork-fix-ci

# Fork-only workflow: run the full test suite on the upstream base and on this branch,
# then build Windows and Android packages with the upstream build workflows.
permissions:
  contents: write

on:
  push:
    branches:
      - fix/webdav-upload-create-parent-dir
  workflow_dispatch:

env:
  UPSTREAM_BASE: 337e2afcb69cba40b45aeb3746dbd6e529caf111

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [base, head]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep gate script from branch head
        run: cp .github/scripts/test_results.py "$RUNNER_TEMP/test_results.py"

      - name: Switch to upstream base
        if: matrix.target == 'base'
        run: git checkout "$UPSTREAM_BASE"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Upstream already has failing tests; the gate job decides pass/fail.
      - name: Run all tests
        shell: bash
        run: |
          flutter test --reporter json > results.jsonl || true
          python3 "$RUNNER_TEMP/test_results.py" summarize results.jsonl summary-${{ matrix.target }}.json

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-${{ matrix.target }}
          path: summary-${{ matrix.target }}.json

  # Gate: head must not add failing tests vs upstream base, and passed(head) >= passed(base).
  gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test summaries
        uses: actions/download-artifact@v4
        with:
          pattern: test-summary-*
          merge-multiple: true

      - name: Compare against upstream base
        run: python3 .github/scripts/test_results.py gate summary-base.json summary-head.json

  build-windows:
    needs: gate
    uses: ./.github/workflows/build-windows.yml

  build-android:
    needs: gate
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
